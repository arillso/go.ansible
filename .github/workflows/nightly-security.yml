---
name: Nightly Security Scan
run-name: |
    Security Scan by @${{ github.actor }}

on:
    schedule:
        - cron: "0 2 * * *" # Daily 02:00 UTC (public repo — Actions minutes are free)
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read
    security-events: write
    actions: read

jobs:
    codeql:
        uses: arillso/.github/.github/workflows/security-code.yml@2026-08-09
        with:
            languages: '["go"]'
            # Keep in sync with the `go` directive in go.mod. The reusable
            # workflow only accepts a literal version, not a go-version-file.
            go-version: "1.26.5"

    trivy:
        uses: arillso/.github/.github/workflows/security-trivy.yml@2026-08-09

    security-secrets:
        uses: arillso/.github/.github/workflows/security-secrets.yml@2026-08-09
